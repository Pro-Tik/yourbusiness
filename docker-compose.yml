version: "3.9"

services:
  campaign:
    build: .
    container_name: yourbusiness_campaign
    restart: unless-stopped          # auto-restarts if it crashes; stops only on explicit `docker compose down`
    env_file: .env                   # API key + Evolution API config
    volumes:
      # Mount the SQLite database from the host so data persists across restarts
      - ./data.sqlite:/app/data.sqlite
    # Optional: forward logs to a file on host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
